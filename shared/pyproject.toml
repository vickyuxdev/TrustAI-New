[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustai-shared"
version = "0.1.0"
description = "TrustAI shared models, database layer, and auth utilities"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "azure-identity>=1.15",
    "msal>=1.26",
    "cryptography>=42.0",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
