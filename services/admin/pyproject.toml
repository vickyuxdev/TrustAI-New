[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustai-admin"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "structlog>=24.0",
    "trustai-shared",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
